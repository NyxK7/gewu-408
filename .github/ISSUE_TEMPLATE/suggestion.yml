name: 建议
description: 想要的新考点、新题型、新功能，或者哪里用起来不顺手
title: "[建议] "
labels: ["建议"]
body:
  - type: textarea
    id: what
    attributes:
      label: 想要什么
      description: 比如「希望把某个考点做成动画」「希望能导出错题」
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么需要它
      description: 复习时遇到了什么不方便，或者真题里常考哪种题
